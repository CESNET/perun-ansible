# versions of containers to deploy
perun_rpc_git_version: v58.0.3
perun_rpc_container_version: v58.0.3
perun_engine_container_version: p_v58.0.3_s_v18.0.1
perun_apache_container_version: gui_v58.0.3_wui_v6.4.1_ngui_v20.17.0
perun_cli_python_container_version: p_v58.0.3_cli_v1.4.0
perun_portainer_version: 2.45.4

# use TLS certificates issued by certbot
perun_use_certbot_certificates: yes

# moved from setting in ansible.cfg to variable in Ansible 12
ansible_managed: |-
  This file is managed by Ansible.
  Do not edit by hand. Make changes in git and re-apply the playbook.

